<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Paciente · Trocar alimento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E7D4F}a:hover{color:#1F5C39}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #5E6862; color: #17251D; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <div aria-hidden="true" style="padding: 28px 20px; color: #DDE3DA; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em">12:00</span>
    <span style="font-size: 28px; font-weight: 800">Almoço</span>
  </div>

  <div role="dialog" aria-label="Trocar Laranja" style="position: absolute; left: 0; right: 0; top: 112px; bottom: 0; background: #F5F6F1; border-radius: 28px 28px 0 0; padding: 10px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #C9CFC4; align-self: center"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 800">Trocar Laranja</h1>
        <span style="font-size: 14px; color: #5B6B61">Grupo Fruta · 1 porção = 70 kcal</span>
      </div>
      <a href="P-Refeicao.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E6DE; display: flex; align-items: center; justify-content: center; color: #17251D">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </a>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: #FFFFFF; border: 1px solid #D5DBD0; border-radius: 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B61" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar fruta</span>
      <input type="search" placeholder="Buscar fruta" style="flex: 1; border: 0; outline: none; font-size: 15px; background: transparent; color: #17251D">
    </label>

    <span style="font-size: 13px; color: #5B6B61">Já na quantidade certa para 1 porção. Só aparecem os alimentos liberados na sua lista.</span>

    <div role="radiogroup" aria-label="Substitutos" style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E2E6DE; border-radius: 20px; overflow: hidden">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="7">
        <label style="{{o.rowStyle}}">
          <input type="radio" name="sub" checked="{{o.selected}}" style="width: 20px; height: 20px; accent-color: #2E7D4F; margin: 0">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 700">{{o.food}}</span>
            <span style="font-size: 13px; color: #5B6B61">{{o.measure}}</span>
          </span>
          <span style="font-size: 13px; font-weight: 600; color: #5B6B61">{{o.grams}}</span>
        </label>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 22px; background: #FFFFFF; border-top: 1px solid #E2E6DE">
    <button style="width: 100%; height: 52px; border-radius: 14px; border: 0; background: #2E7D4F; color: #FFFFFF; font-size: 16px; font-weight: 700">Trocar por Banana prata</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = 'display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 16px; border-bottom: 1px solid #EEF1EA; cursor: pointer; box-sizing: border-box;';
    const options = [
      { food: 'Banana prata', measure: '1 unidade', grams: '40 g', selected: true },
      { food: 'Maçã', measure: '1 unidade pequena', grams: '90 g' },
      { food: 'Abacaxi', measure: '1 fatia média', grams: '130 g' },
      { food: 'Melancia', measure: '1 fatia média', grams: '200 g' },
      { food: 'Morango', measure: '10 unidades', grams: '240 g' },
      { food: 'Uva', measure: '12 bagos', grams: '90 g' },
      { food: 'Tangerina', measure: '1 unidade média', grams: '135 g' }
    ].map((o) => ({ ...o, selected: !!o.selected, rowStyle: row + (o.selected ? 'background: #E6F2EA;' : '') }));
    return { options };
  }
}
</script>
</body>
</html>
