<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Paciente · Refeição</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E7D4F}a:hover{color:#1F5C39}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F5F6F1; color: #17251D; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
      <a href="Main.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E6DE; display: flex; align-items: center; justify-content: center; color: #17251D">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: #5B6B61; padding: 6px 10px; background: #FFFFFF; border: 1px solid #E2E6DE; border-radius: 999px">3 de 6</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 700; color: {{accent}}; letter-spacing: 0.06em; text-transform: uppercase">12:00</span>
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Almoço</h1>
      <div style="display: flex; gap: 8px; margin-top: 4px">
        <span style="font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #E6F2EA; color: #1F5C39">737 kcal</span>
        <span style="font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E6DE; color: #17251D">52 g carboidratos</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E2E6DE; border-radius: 20px; overflow: hidden">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-bottom: 1px solid #EEF1EA; min-height: 64px; box-sizing: border-box">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-size: 15px; font-weight: 700">{{it.food}}</span>
            <span style="font-size: 13px; color: #5B6B61">{{it.measure}} · {{it.portion}}</span>
          </div>
          <a href="P-Substituir.dc.html" style="height: 36px; padding: 0 12px; border-radius: 10px; background: #F0F2EC; color: #17251D; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4"></path><path d="M3 8h13a4 4 0 0 1 0 8h-2"></path><path d="m17 20 4-4-4-4"></path></svg>Trocar</a>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; gap: 10px; padding: 12px 14px; background: #FBEDE3; border-radius: 14px; align-items: flex-start">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A3F14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
      <span style="font-size: 13px; line-height: 1.45; color: #6E2D0E">Recado da nutri: prefira a fruta de sobremesa com bagaço. Salada sem molho pronto.</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 22px; background: #FFFFFF; border-top: 1px solid #E2E6DE; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px">
      <button style="flex: 2; height: 52px; border-radius: 14px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 700">Comi tudo</button>
      <button style="flex: 1; height: 52px; border-radius: 14px; border: 1px solid #D5DBD0; background: #FFFFFF; color: #17251D; font-size: 15px; font-weight: 600">Pulei</button>
      <button aria-label="Enviar foto do prato" style="width: 52px; height: 52px; border-radius: 14px; border: 1px solid #D5DBD0; background: #FFFFFF; color: #17251D; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2E7D4F","options":["#2E7D4F","#2F6FA8","#7A4FB0","#B4532A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#2E7D4F',
      items: [
        { food: 'Arroz branco', measure: '2 colheres de servir', portion: '2 porções de Arroz' },
        { food: 'Feijão carioca', measure: '1 concha média', portion: '2 porções de Feijão' },
        { food: 'Filé de frango grelhado', measure: '140 g', portion: '1¾ porção de Carne ou ovo' },
        { food: 'Legumes cozidos', measure: '3 colheres de sopa', portion: '1 porção de Vegetal B' },
        { food: 'Salada de folhas', measure: 'à vontade', portion: 'Vegetal A, livre' },
        { food: 'Laranja', measure: '1 unidade média', portion: '1 porção de Fruta' }
      ]
    };
  }
}
</script>
</body>
</html>
