<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Paciente · Anamnese</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E7D4F}a:hover{color:#1F5C39}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F5F6F1; color: #17251D; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
      <a href="P-Progresso.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E6DE; display: flex; align-items: center; justify-content: center; color: #17251D">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </a>
      <span style="font-size: 13px; color: #5B6B61; font-weight: 500">Salvo automaticamente</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="12">
          <span style="{{s.style}}"></span>
        </sc-for>
      </div>
      <span style="font-size: 13px; font-weight: 600; color: #5B6B61">Passo 7 de 12 · Anamnese para o retorno de 06/11</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Sua rotina</h1>
      <span style="font-size: 15px; line-height: 1.45; color: #5B6B61">Com isso a nutri ajusta os horários das refeições ao seu dia.</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 600">Acorda às</span>
        <input type="time" value="06:30" style="height: 48px; border-radius: 12px; border: 1px solid #D5DBD0; background: #FFFFFF; padding: 0 12px; font-size: 16px; color: #17251D">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 600">Dorme às</span>
        <input type="time" value="23:00" style="height: 48px; border-radius: 12px; border: 1px solid #D5DBD0; background: #FFFFFF; padding: 0 12px; font-size: 16px; color: #17251D">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 600">Trabalho começa</span>
        <input type="time" value="08:00" style="height: 48px; border-radius: 12px; border: 1px solid #D5DBD0; background: #FFFFFF; padding: 0 12px; font-size: 16px; color: #17251D">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 600">Trabalho termina</span>
        <input type="time" value="17:00" style="height: 48px; border-radius: 12px; border: 1px solid #D5DBD0; background: #FFFFFF; padding: 0 12px; font-size: 16px; color: #17251D">
      </label>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">Almoça fora de casa?</legend>
      <div style="display: flex; gap: 8px">
        <button aria-pressed="true" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid #2E7D4F; background: #E6F2EA; color: #1F5C39; font-size: 14px; font-weight: 700">Todo dia</button>
        <button style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #D5DBD0; background: #FFFFFF; color: #17251D; font-size: 14px; font-weight: 600">Às vezes</button>
        <button style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #D5DBD0; background: #FFFFFF; color: #17251D; font-size: 14px; font-weight: 600">Não</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">Quem prepara a comida?</legend>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #D5DBD0; background: #FFFFFF; color: #17251D; font-size: 14px; font-weight: 600">Eu</button>
        <button aria-pressed="true" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid #2E7D4F; background: #E6F2EA; color: #1F5C39; font-size: 14px; font-weight: 700">Outra pessoa</button>
        <button style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #D5DBD0; background: #FFFFFF; color: #17251D; font-size: 14px; font-weight: 600">Compro pronta</button>
      </div>
    </fieldset>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 22px; background: #FFFFFF; border-top: 1px solid #E2E6DE; display: flex; gap: 10px">
    <button style="flex: 1; height: 52px; border-radius: 14px; border: 1px solid #D5DBD0; background: #FFFFFF; color: #17251D; font-size: 16px; font-weight: 600">Voltar</button>
    <button style="flex: 2; height: 52px; border-radius: 14px; border: 0; background: #2E7D4F; color: #FFFFFF; font-size: 16px; font-weight: 700">Continuar</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const steps = Array.from({ length: 12 }, (_, i) => ({
      style: 'display: block; height: 6px; border-radius: 3px; background: ' + (i < 6 ? '#2E7D4F' : i === 6 ? '#17251D' : '#DDE2D7') + ';'
    }));
    return { steps };
  }
}
</script>
</body>
</html>
