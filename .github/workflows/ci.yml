name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android-desktop:
    name: Android e desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes (Android host e desktop)
        run: ./gradlew :shared:testAndroidHostTest :shared:jvmTest
      - name: Build do app Android
        run: ./gradlew :androidApp:assembleDebug
      - name: Build do app desktop
        run: ./gradlew :desktopApp:compileKotlin

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes no simulador iOS
        run: ./gradlew :shared:iosSimulatorArm64Test
