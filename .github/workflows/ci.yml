name: CI

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:

jobs:
  android-desktop:
    name: Android e desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes (Android host e desktop)
        run: ./gradlew :shared:testAndroidHostTest :shared:jvmTest
      - name: Build do app Android
        run: ./gradlew :androidApp:assembleDebug
      - name: Build do app desktop
        run: ./gradlew :desktopApp:compileKotlin

  web:
    name: Web (wasmJs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build da web
        run: ./gradlew :webApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: webApp/build/dist/wasmJs/productionExecutable/

  ios:
    name: iOS
    # Pedido do Guilherme (04/11/2026): o iOS só roda na release 1.3.0 em diante (PR de release/*, push em main, release/* ou tag).
    if: github.event_name == 'push' || startsWith(github.head_ref, 'release/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes no simulador iOS
        run: ./gradlew :shared:iosSimulatorArm64Test
